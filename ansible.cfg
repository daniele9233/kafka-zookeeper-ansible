[defaults]
inventory = inventories/inventory.ini
roles_path = roles

# Log di tutte le esecuzioni: ogni run viene accodato con timestamp per task.
log_path = ./ansible.log

# profile_tasks stampa la durata di ogni task, timer il totale della run:
# servono a individuare subito i task lenti (es. il download dei tarball).
callbacks_enabled = profile_tasks, timer

forks = 10
timeout = 30
display_skipped_hosts = False
retry_files_enabled = False
interpreter_python = auto_silent

[ssh_connection]
pipelining = True
ssh_args = -C -o ControlMaster=auto -o ControlPersist=300s
