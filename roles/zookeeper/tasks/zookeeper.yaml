---

- name: Check whether ZooKeeper is already installed
  ansible.builtin.stat:
    path: "{{ zookeeper_install_dir }}/bin/zkServer.sh"
  register: zookeeper_installed

- name: Download ZooKeeper archive
  ansible.builtin.get_url:
    url: "https://archive.apache.org/dist/zookeeper/zookeeper-{{ zookeeper_version }}/{{ zookeeper_archive_basename }}.tar.gz"
    dest: "/opt/{{ zookeeper_archive_basename }}.tar.gz"
    mode: '0644'
  when: not zookeeper_installed.stat.exists

- name: Extract ZooKeeper archive
  ansible.builtin.unarchive:
    src: "/opt/{{ zookeeper_archive_basename }}.tar.gz"
    dest: /opt
    remote_src: yes
  when: not zookeeper_installed.stat.exists

- name: Rename the extracted directory to the target install directory
  ansible.builtin.command:
    cmd: "mv /opt/{{ zookeeper_archive_basename }} {{ zookeeper_install_dir }}"
    # Evita che un'installazione parziale finisca annidata dentro se stessa.
    creates: "{{ zookeeper_install_dir }}"
  when:
    - not zookeeper_installed.stat.exists
    - zookeeper_archive_basename != zookeeper_install_dir | basename

- name: Create symbolic link
  ansible.builtin.file:
    src: "{{ zookeeper_install_dir }}"
    dest: "{{ zookeeper_home }}"
    state: link

- name: Set ownership of ZooKeeper directory
  ansible.builtin.file:
    path: "{{ zookeeper_install_dir }}"
    state: directory
    owner: zookeeper
    group: zookeeper
    recurse: true

- name: Copy zoo.cfg from zoo_sample.cfg
  ansible.builtin.command:
    cmd: "cp {{ zookeeper_home }}/conf/zoo_sample.cfg {{ zookeeper_home }}/conf/zoo.cfg"
  args:
    creates: "{{ zookeeper_home }}/conf/zoo.cfg"  # Use 'creates' to check if copying is necessary

- name: Update content of zoo.cfg
  template:
    src: "zoo.cfg.j2"
    dest: "{{ zookeeper_home }}/conf/zoo.cfg"
    owner: zookeeper
    group: zookeeper
    backup: true

- name: Create path for myid file
  ansible.builtin.file:
    path: "{{ zookeeper_data_dir }}"
    state: directory
    owner: zookeeper
    group: zookeeper

- name: Populate myid
  template:
    src: myid.j2
    dest: "{{ zookeeper_data_dir }}/myid"
    owner: zookeeper
    group: zookeeper

- name: Create zookeeper service
  template:
    src: zookeeper.service.j2
    dest: /etc/systemd/system/zookeeper.service
    owner: root
    group: root
    mode: '0644'
  notify:
    - Reload systemd  # Notify the handler to reload systemd after creating the service file

- name: Flush handlers so systemd is reloaded before the service is started
  ansible.builtin.meta: flush_handlers

- name: Start zookeeper service
  ansible.builtin.systemd:
    name: zookeeper
    state: started

- name: Enable the zookeeper service to start on boot
  ansible.builtin.systemd:
    name: zookeeper
    enabled: true
