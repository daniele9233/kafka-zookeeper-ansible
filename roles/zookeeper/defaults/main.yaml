---

zookeeper_user_password: zookeeper

java_version: "zulu11.86.19-ca-jdk11.0.30-linux_x64"
java_url: "https://cdn.azul.com/zulu/bin/{{ java_version }}.tar.gz"
java_install_dir: "/usr/lib/jvm"
java_home: "{{ java_install_dir }}/{{ java_version }}"

zookeeper_version: "3.8.1"

# Directory prodotta dal tarball ufficiale, usata come directory di
# installazione: e' il layout in uso in collaudo
# (/opt/apache-zookeeper-3.8.1-bin con symlink /opt/zookeeper).
zookeeper_install_dir: "/opt/apache-zookeeper-{{ zookeeper_version }}-bin"
zookeeper_home: "/opt/zookeeper"

zookeeper_data_dir: "{{ zookeeper_home }}/data/zookeeper"
zookeeper_client_port: 2181
zookeeper_peer_port: 2888
zookeeper_election_port: 3888
