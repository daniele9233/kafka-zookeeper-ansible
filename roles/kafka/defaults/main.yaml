---

# ---------------------------------------------------------------------------
# Utente di sistema
# ---------------------------------------------------------------------------
kafka_user_password: kafka
# Salt fisso: senza, password_hash() ne genera uno casuale a ogni esecuzione,
# l'hash cambia e il task risulta "changed" ad ogni run.
kafka_user_password_salt: "kafkaZkpSalt01"

# ---------------------------------------------------------------------------
# Java
# ---------------------------------------------------------------------------
java_version: "zulu11.86.19-ca-jdk11.0.30-linux_x64"
java_url: "https://cdn.azul.com/zulu/bin/{{ java_version }}.tar.gz"
java_install_dir: "/usr/lib/jvm"
java_home: "{{ java_install_dir }}/{{ java_version }}"

# ---------------------------------------------------------------------------
# Kafka
# ---------------------------------------------------------------------------
scala_version: "2.13"
kafka_version: "3.4.0"
# archive.apache.org e' throttlato e il tarball pesa oltre 100 MB per nodo:
# valorizzare kafka_mirror_url per puntare a un mirror interno e' il modo piu'
# efficace di accorciare i tempi di installazione.
kafka_mirror_url: "https://archive.apache.org/dist/kafka"
kafka_url: "{{ kafka_mirror_url }}/{{ kafka_version }}/kafka_{{ scala_version }}-{{ kafka_version }}.tgz"
kafka_archive_path: "/opt/kafka_{{ scala_version }}-{{ kafka_version }}.tgz"

# Percorso fisico (kafka_2.13-3.4.0) usato per la generazione dei certificati,
# e symlink standard usato dalle configurazioni e dai comandi di avvio.
kafka_install_dir: "/opt/kafka_{{ scala_version }}-{{ kafka_version }}"
kafka_home: "/opt/kafka"
kafka_log_dirs: "{{ kafka_home }}/kafka-logs"

kafka_broker_port: 9092
kafka_group_id: "my-consumer-group"
kafka_consumer_bootstrap_server_port: "{{ kafka_broker_port }}"
kafka_producer_bootstrap_server_port: "{{ kafka_broker_port }}"
zookeeper_connect_port: 2181

# Heap effettivamente in uso in collaudo: sono i default di Kafka
# (-Xmx1G -Xms1G), nessun override.
kafka_heap_opts: "-Xmx1G -Xms1G"

kafka_num_partitions: 1
kafka_min_insync_replicas: 2
kafka_offsets_topic_replication_factor: 3
kafka_transaction_state_log_replication_factor: 3
kafka_transaction_state_log_min_isr: 2

# Usato solo nella riga commentata di producer.properties, come in collaudo.
kafka_transactional_id: "sintesi-prod-app"

# ---------------------------------------------------------------------------
# Autenticazione SASL_SSL + SCRAM-SHA-512
# ---------------------------------------------------------------------------
kafka_security_protocol: "SASL_SSL"
kafka_sasl_mechanism: "SCRAM-SHA-512"

# Utente inter-broker / amministrativo censito in ZooKeeper.
kafka_sasl_admin_user: "kafkaadmin"
kafka_sasl_admin_password: "SINTESIprod.2026"

# Password di keystore, chiave privata e truststore PKCS12.
kafka_ssl_password: "SINTESIprod.2026"

# ---------------------------------------------------------------------------
# PKI interna (Root CA + certificati broker)
# ---------------------------------------------------------------------------
# Directory sul controller Ansible che ospita la Root CA: svolge il ruolo di
# "Master CA" che nel documento di riferimento e' assegnato al Nodo 1.
kafka_local_ca_dir: "{{ playbook_dir }}/pki"

kafka_ssl_dir: "{{ kafka_home }}/config/ssl"
kafka_ssl_dir_physical: "{{ kafka_install_dir }}/config/ssl"
kafka_broker_name: "broker-{{ broker_id }}"
kafka_broker_ssl_dir: "{{ kafka_ssl_dir }}/{{ kafka_broker_name }}"
kafka_broker_ssl_dir_physical: "{{ kafka_ssl_dir_physical }}/{{ kafka_broker_name }}"

kafka_ca_subject: "/C=IT/O=Kafka-Test/OU=IT/CN=Kafka-Test-Root-CA"
kafka_broker_subject: "/C=IT/O=Kafka-Test/OU=Kafka-Broker/CN={{ inventory_hostname }}"
kafka_ca_validity_days: 3650
kafka_cert_validity_days: 825
kafka_ca_key_size: 4096
kafka_broker_key_size: 2048
kafka_truststore_alias: "kafka-test-root-ca"

# Profilo per gli script di amministrazione CLI.
kafka_client_properties_path: "/root/client.properties"

# ---------------------------------------------------------------------------
# Download
# ---------------------------------------------------------------------------
# timeout: stallo massimo sul socket.
# async/poll: tetto massimo complessivo, altrimenti un mirror lento puo'
# tenere il task appeso a tempo indefinito.
download_timeout: 60
download_async_timeout: 1800
download_poll_interval: 15
