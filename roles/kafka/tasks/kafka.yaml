---

- name: Check whether Kafka is already installed
  ansible.builtin.stat:
    path: "{{ kafka_install_dir }}/bin/kafka-server-start.sh"
  register: kafka_installed

- name: Check whether the Kafka archive has already been downloaded
  ansible.builtin.stat:
    path: "{{ kafka_archive_path }}"
  register: kafka_archive

# Oltre 100 MB da un mirror throttlato: 'async' impone un tetto massimo, senza
# il quale il task puo' restare appeso a tempo indefinito.
- name: Download Kafka archive
  ansible.builtin.get_url:
    url: "{{ kafka_url }}"
    dest: "{{ kafka_archive_path }}"
    mode: 0644
    timeout: "{{ download_timeout }}"
  async: "{{ download_async_timeout }}"
  poll: "{{ download_poll_interval }}"
  when:
    - not kafka_installed.stat.exists
    - not kafka_archive.stat.exists

- name: Extract Kafka archive
  ansible.builtin.unarchive:
    src: "{{ kafka_archive_path }}"
    dest: /opt
    remote_src: yes
    creates: "{{ kafka_install_dir }}"  # Use 'creates' to check if extraction is necessary

- name: Create symbolic link
  ansible.builtin.file:
    src: "{{ kafka_install_dir }}"
    dest: "{{ kafka_home }}"
    state: link

- name: Set ownership of Kafka directory
  ansible.builtin.file:
    path: "{{ kafka_install_dir }}"
    state: directory
    owner: kafka
    group: kafka
    recurse: true

- name: Update kafka configuration file
  template:
    src: server.properties.j2
    dest: "{{ kafka_home }}/config/server.properties"
    owner: kafka
    group: kafka
    mode: '0640'
  notify:
    - Restart kafka

- name: Update consumer configuration file
  template:
    src: consumer.properties.j2
    dest: "{{ kafka_home }}/config/consumer.properties"
    owner: kafka
    group: kafka
    mode: '0640'

- name: Update producer configuration file
  template:
    src: producer.properties.j2
    dest: "{{ kafka_home }}/config/producer.properties"
    owner: kafka
    group: kafka
    mode: '0640'

- name: Create the CLI client profile
  template:
    src: client.properties.j2
    dest: "{{ kafka_client_properties_path }}"
    owner: root
    group: root
    mode: '0600'

- name: Update kafka-run-class.sh
  ansible.builtin.lineinfile:
    path: "{{ kafka_home }}/bin/kafka-run-class.sh"
    line: "JAVA_HOME={{ java_home }}"
    insertbefore: '^if \[ \$# -lt 1 \];'
    #insertbefore: "BOF"
    state: present

- name: Update zookeeper-server-start.sh set javaopts
  template:
    src: zookeeper-server-start.sh.j2
    dest: "{{ kafka_home }}/bin/zookeeper-server-start.sh"
    owner: kafka
    group: kafka
    mode: '0755'
